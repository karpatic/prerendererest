<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prerendererest</title>
    <meta
      name="description"
      content="Prerendererest - CLI pre-rendering tool for static site generation"
    />
    <style>
      :root {
        --bg: #0f172a;
        --card: #111827;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #38bdf8;
        --accent2: #22c55e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: radial-gradient(circle at top, #1e293b, var(--bg));
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(760px, 100%);
        background: color-mix(in srgb, var(--card) 88%, black);
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin-top: 0;
        margin-bottom: 8px;
        font-size: clamp(1.8rem, 4vw, 2.4rem);
      }
      p {
        margin-top: 0;
        color: var(--muted);
      }
      .links {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 12px;
        margin: 20px 0;
      }
      a {
        display: block;
        text-decoration: none;
        color: var(--text);
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 14px;
        background: #0b1220;
        transition: transform 0.12s ease, border-color 0.12s ease;
      }
      a:hover {
        transform: translateY(-2px);
        border-color: var(--accent);
      }
      .small {
        font-size: 0.9rem;
        color: var(--muted);
      }
      code {
        background: #0b1220;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 2px 7px;
        color: #d1fae5;
      }
      .footer {
        margin-top: 18px;
        font-size: 0.9rem;
      }
      .dot {
        color: var(--accent2);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Prerendererest <span class="dot">●</span></h1>
      <p>Fast, flexible pre-rendering for React/Vue/SPA static output with Puppeteer.</p>

      <div class="links">
        <a href="https://github.com/karpatic/prerendererest" target="_blank" rel="noreferrer">
          <strong>GitHub Repository</strong>
          <div class="small">Source, issues, and workflows</div>
        </a>
        <a href="https://www.npmjs.com/package/prerendererest" target="_blank" rel="noreferrer">
          <strong>npm Package</strong>
          <div class="small">Install + package metadata</div>
        </a>
        <a href="https://unpkg.com/prerendererest/" target="_blank" rel="noreferrer">
          <strong>unpkg CDN</strong>
          <div class="small">Latest package files</div>
        </a>
        <a href="https://cdn.jsdelivr.net/npm/prerendererest/" target="_blank" rel="noreferrer">
          <strong>jsDelivr CDN</strong>
          <div class="small">Global CDN endpoint</div>
        </a>
      </div>

      <p class="footer">
        Quick start: <code>npm install prerendererest</code>
      </p>
    </main>
  </body>
</html>
